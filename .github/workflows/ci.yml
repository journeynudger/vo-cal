# Continuous verification for every change that reaches GitHub.
#
# The repository is public, so GitHub Actions minutes are free on every runner, including
# macOS: the whole ladder runs on every push to main and every pull request, and again
# nightly. Three jobs, each the same script a developer runs locally (AGENTS.md verification
# tiers), so a green run means what the local run means:
#
#   api        ruff + pytest (with the Python ratchet table) and the parser corpus ratchet
#              against the committed SCORES.md. Ubuntu, about half a minute.
#   libraries  SPM build + the library tests (with the Swift ratchet table) and the
#              voice kernel's deterministic simulation. macOS, about a minute.
#   app        The iOS app compiled against the zero-warning ratchet, the render tests (the
#              fast UI loop: blank guard, bar geometry, goldens when the runtime matches),
#              then the twelve voice runtime scenarios on a simulator picked from the
#              runner's newest iOS runtime. macOS, a few minutes.
#   ui-audit   Nightly and on demand only: the real app in mock mode, every screen through
#              Xcode's accessibility audit (bin/ios-ui-audit). macOS, minutes.
#
# Toolchain: the jobs select Xcode 26.2 by path and FAIL when it is absent. The previous
# workflow fell back to `/Applications/Xcode.app` silently, so a runner image change could
# have built with a different toolchain and still reported green (restructure Phase 0.3,
# 2026-09-23). Docs-only pushes skip the workflow.
#
# Enforcement on the server side is branch protection (required checks: api, libraries, app);
# the local gate is `.githooks/pre-push` (make setup installs it).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  schedule:
    # Nightly full run on main, 02:17 New York time in summer.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: cd services/api && uv sync
      - name: ruff + pytest (with the ratchet table)
        run: scripts/check-api
      - name: Parser corpus ratchet (against the committed SCORES.md)
        run: scripts/parser-eval

  libraries:
    name: Libraries
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Xcode 26.2, no silent fallback)
        run: |
          test -d /Applications/Xcode_26.2.app || { echo "Xcode 26.2 is not on this runner image:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          swift --version
      - name: swift test (with the ratchet table)
        run: swift test
      - name: Voice kernel simulation (smoke)
        env:
          VOICE_DST_SMOKE_MAX_MS: "600000"
        run: bin/voice-dst --smoke

  app:
    name: iOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Xcode 26.2, no silent fallback)
        run: |
          test -d /Applications/Xcode_26.2.app || { echo "Xcode 26.2 is not on this runner image:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen
      - name: Compile (zero-warning ratchet)
        env:
          APP_BUILD_MAX_MS: "1200000"
        run: bin/ios-app-build
      # The scripts pin a simulator by UDID; on a runner the pin is whichever iPhone carries
      # the newest iOS runtime (bin/ci-pick-simulator). Any iOS 26 iPhone runs the same
      # scenarios as the pinned one.
      - name: Pick a simulator
        run: bin/ci-pick-simulator >> "$GITHUB_ENV"
      # The fast UI loop (docs/UI_VERIFICATION.md). The goldens compare only on the iOS
      # runtime they were recorded on (apps/ios/VoCalRenderTests/__Snapshots__/RUNTIME.txt)
      # and skip out loud on any other; the blank guard, the bar geometry and its pixel
      # round trip run everywhere.
      - name: Render tests
        run: |
          echo "simulator: $IOS_SIM_NAME ($IOS_SIM_UDID)"
          bin/ios-render-tests
      - name: Voice runtime scenarios on the simulator
        env:
          SELF_TEST_TIMEOUT: "600"
        run: |
          echo "simulator: $IOS_SIM_NAME ($IOS_SIM_UDID)"
          bin/ios-sim-voice-test
      - name: Simulator diagnostics
        if: failure()
        run: |
          xcrun simctl list devices booted || true
          find ~/Library/Developer/CoreSimulator/Devices -name "debug-events*.jsonl" -newer Package.swift -exec tail -n 40 {} \; 2>/dev/null | head -200 || true

  ui-audit:
    name: UI audit (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Xcode 26.2, no silent fallback)
        run: |
          test -d /Applications/Xcode_26.2.app || { echo "Xcode 26.2 is not on this runner image:"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Tools
        run: brew install xcodegen
      - name: Pick a simulator
        run: bin/ci-pick-simulator >> "$GITHUB_ENV"
      - name: Accessibility audit of every screen
        run: |
          echo "simulator: $IOS_SIM_NAME ($IOS_SIM_UDID)"
          bin/ios-ui-audit
      - name: Audit result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-xcresult
          path: .build/ui-audit.xcresult
          if-no-files-found: ignore
